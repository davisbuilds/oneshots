<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#070a24">
<title>Luminal</title>
<meta name="description" content="Luminal: a one-button rhythm platformer. One level, Heliotrope, synchronized to an original synthesized soundtrack.">
<style>
  :root {
    --ink: #eef3ff; --dim: #9aa6d6; --acc: #6ff6e6; --acc2: #b6a4ff; --haz: #ff2d55; --gold: #ffd84a;
    --panel: rgba(8, 10, 32, 0.72); --line: rgba(160, 190, 255, 0.18);
    font-family: "Avenir Next", "Futura", "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #070a24; color: var(--ink); overflow: hidden; overscroll-behavior: none; }
  body { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
  canvas#view { position: fixed; inset: 0; display: block; touch-action: none; cursor: pointer; }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--acc); outline-offset: 3px; }

  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px 16px; text-align: center; z-index: 5; }
  .screen.dim { background: radial-gradient(ellipse at center, rgba(5, 6, 20, 0.55), rgba(5, 6, 20, 0.86)); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  #title { background: linear-gradient(180deg, rgba(5, 6, 22, 0.15) 0%, rgba(5, 6, 22, 0.55) 70%, rgba(5, 6, 22, 0.8) 100%); }

  .logo { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .logo svg { width: min(120px, 24vw); height: auto; filter: drop-shadow(0 0 18px rgba(111, 246, 230, 0.55)); }
  .wordmark { font-size: clamp(42px, 10vw, 104px); font-weight: 600; letter-spacing: 0.32em; margin-right: -0.32em; line-height: 1;
    background: linear-gradient(180deg, #ffffff 10%, #bff8f0 45%, #8d7bff 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 24px rgba(141, 123, 255, 0.55)); }
  .subtitle { color: var(--dim); letter-spacing: 0.4em; margin-right: -0.4em; font-size: clamp(11px, 2.2vw, 14px); text-transform: uppercase; }
  .level-name { margin-top: 4px; font-size: clamp(14px, 3vw, 18px); letter-spacing: 0.18em; color: #ffd9c4; }

  .buttons { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .btn { min-width: 150px; padding: 13px 26px; border-radius: 999px; border: 1px solid var(--line); background: rgba(20, 26, 70, 0.55); letter-spacing: 0.14em; text-transform: uppercase; font-size: 14px; transition: transform 0.12s, background 0.2s, border-color 0.2s; }
  .btn:hover:not(:disabled) { transform: translateY(-1px); border-color: rgba(160, 230, 255, 0.5); background: rgba(30, 40, 100, 0.7); }
  .btn.primary { background: linear-gradient(135deg, #4ff3e0, #8d7bff); color: #0a0c26; border: none; font-weight: 700; box-shadow: 0 0 28px rgba(111, 246, 230, 0.35); }
  .btn.primary:hover:not(:disabled) { box-shadow: 0 0 40px rgba(111, 246, 230, 0.55); }
  .btn:disabled { opacity: 0.4; cursor: progress; }
  .hint { color: var(--dim); font-size: 13px; letter-spacing: 0.06em; line-height: 1.7; }
  .hint kbd { font: inherit; font-size: 12px; padding: 1px 7px; border: 1px solid var(--line); border-radius: 5px; color: var(--ink); background: rgba(255, 255, 255, 0.05); }
  #loadState { min-height: 1.4em; color: var(--acc); font-size: 13px; letter-spacing: 0.08em; }

  #stats { display: grid; grid-template-columns: repeat(4, auto); gap: 6px 26px; align-items: end; justify-content: center; }
  .stat { display: flex; flex-direction: column; gap: 2px; }
  .stat span { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--dim); }
  .stat b { font-size: 22px; font-weight: 600; }
  .heat { grid-column: 1 / -1; position: relative; display: flex; align-items: flex-end; gap: 2px; height: 30px; width: min(420px, 86vw); margin-top: 6px; border-bottom: 1px solid var(--line); }
  .heat i { flex: 1; background: var(--haz); border-radius: 1px 1px 0 0; }
  .heat em { position: absolute; bottom: -4px; width: 2px; height: 38px; background: var(--gold); box-shadow: 0 0 8px var(--gold); transform: translateX(-1px); }

  details.settings { color: var(--dim); font-size: 13px; }
  details.settings summary { cursor: pointer; letter-spacing: 0.15em; text-transform: uppercase; font-size: 12px; list-style: none; }
  details.settings summary::-webkit-details-marker { display: none; }
  .settings-body { margin-top: 12px; display: grid; gap: 10px; justify-items: start; padding: 14px 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); text-align: left; }
  .settings-body label { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .settings-body input[type=range] { width: 160px; accent-color: var(--acc); }
  .settings-body input[type=checkbox] { accent-color: var(--acc); width: 16px; height: 16px; }
  .linkish { background: none; border: none; color: var(--dim); text-decoration: underline; padding: 0; font-size: 12px; }

  /* HUD */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  #prog { position: absolute; top: max(14px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); width: min(440px, 62vw); height: 8px; border-radius: 99px; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.18); overflow: visible; }
  #progFill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 99px; background: linear-gradient(90deg, #4ff3e0, #ffffff); box-shadow: 0 0 12px rgba(111, 246, 230, 0.7); }
  #hud.practice #progFill { background: linear-gradient(90deg, #4dff9a, #e6fff0); box-shadow: 0 0 12px rgba(77, 255, 154, 0.7); }
  #progBest { position: absolute; top: -5px; width: 2px; height: 16px; background: var(--gold); box-shadow: 0 0 6px var(--gold); transform: translateX(-1px); }
  #cpMarks i { position: absolute; top: -3px; width: 8px; height: 12px; transform: translateX(-4px) rotate(45deg) scale(0.7); background: #4dff9a; border-radius: 2px; }
  #progPct { position: absolute; left: calc(100% + 12px); top: 50%; transform: translateY(-50%); font-size: 14px; font-variant-numeric: tabular-nums; letter-spacing: 0.06em; }
  .hudbtn { pointer-events: auto; position: absolute; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: rgba(10, 14, 40, 0.5); display: grid; place-items: center; font-size: 15px; }
  #pauseBtn { top: max(8px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right)); }
  #practiceBar { position: absolute; bottom: max(14px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); display: flex; gap: 10px; align-items: center; pointer-events: auto; }
  #practiceBar .hudbtn { position: static; width: auto; padding: 0 14px; gap: 8px; display: flex; font-size: 13px; letter-spacing: 0.06em; }
  #practiceBar .count { font-size: 12px; color: #c9ffe0; letter-spacing: 0.1em; }
  #practiceBar .diamond { width: 10px; height: 10px; background: #4dff9a; transform: rotate(45deg); border-radius: 2px; box-shadow: 0 0 8px #4dff9a; }
  #attemptLabel { position: fixed; left: 0; top: 0; z-index: 2; pointer-events: none; font-size: clamp(22px, 4vw, 40px); font-weight: 600; letter-spacing: 0.12em; white-space: nowrap; color: #fff; text-shadow: 0 0 18px rgba(160, 220, 255, 0.8); opacity: 0; }
  #signs div { position: fixed; left: 0; top: 0; z-index: 2; pointer-events: none; white-space: nowrap; font-size: clamp(13px, 2vw, 18px); letter-spacing: 0.14em; text-transform: uppercase; color: rgba(240, 248, 255, 0.95); text-shadow: 0 0 3px rgba(4, 6, 24, 0.95), 0 0 10px rgba(4, 6, 24, 0.8), 0 0 18px rgba(120, 200, 255, 0.5); }
  #sectionCard { position: fixed; left: 50%; top: max(44px, calc(env(safe-area-inset-top) + 36px)); transform: translateX(-50%); z-index: 3; pointer-events: none; opacity: 0; font-size: 13px; letter-spacing: 0.5em; margin-right: -0.5em; text-transform: uppercase; color: #fff; text-shadow: 0 0 10px rgba(160, 220, 255, 0.8), 0 0 3px rgba(0, 0, 20, 0.9); white-space: nowrap; }
  #sectionCard span { color: var(--gold); margin-right: 0.9em; }
  #sectionCard.show { animation: card 2.2s ease-out forwards; }
  @keyframes card { 0% { opacity: 0; letter-spacing: 0.9em; } 18% { opacity: 1; letter-spacing: 0.5em; } 75% { opacity: 1; } 100% { opacity: 0; } }
  #deathinfo { position: fixed; left: 50%; top: 22%; transform: translate(-50%, -50%); z-index: 4; pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 6px; opacity: 0; }
  #deathinfo b { font-size: clamp(40px, 9vw, 72px); font-weight: 600; letter-spacing: 0.04em; text-shadow: 0 0 24px rgba(255, 45, 85, 0.8); }
  #deathinfo .nb { color: var(--gold); letter-spacing: 0.3em; text-transform: uppercase; font-size: 14px; text-shadow: 0 0 12px rgba(255, 216, 74, 0.8); }
  #deathinfo .pm { color: #8dffbc; letter-spacing: 0.3em; text-transform: uppercase; font-size: 11px; }
  #deathinfo.show { animation: pop 0.75s ease-out forwards; }
  @keyframes pop { 0% { opacity: 0; transform: translate(-50%, -40%) scale(0.85); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1.06); } 70% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -55%) scale(1); } }

  #complete { background: radial-gradient(ellipse at center, rgba(12, 6, 26, 0.74), rgba(5, 4, 16, 0.94)); }
  #complete h2 { margin: 0; font-size: clamp(30px, 7vw, 64px); font-weight: 600; letter-spacing: 0.24em; margin-right: -0.24em; background: linear-gradient(180deg, #fff, #ffe6a8 60%, #ff9de2); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 22px rgba(255, 230, 168, 0.6)); }
  #completeStats { color: #ffe9cf; line-height: 1.8; letter-spacing: 0.04em; }
  #pause h2 { margin: 0; letter-spacing: 0.3em; margin-right: -0.3em; font-weight: 600; }
  #pauseInfo { color: var(--dim); letter-spacing: 0.08em; }
  #fatal { position: fixed; inset: 0; display: grid; place-items: center; padding: 30px; text-align: center; z-index: 10; background: #070a24; }
  @media (max-height: 520px) {
    .logo svg, .hint, .subtitle { display: none; }
    .screen { gap: 10px; padding-top: 12px; padding-bottom: 12px; }
    .wordmark { font-size: 40px; }
    .stat b { font-size: 17px; } .heat { height: 18px; }
    #stats { gap: 2px 20px; }
  }
  @media (orientation: portrait) and (max-width: 640px) { #rotateHint { display: block !important; } }
  #rotateHint { display: none; color: var(--dim); font-size: 12px; letter-spacing: 0.08em; }
</style>
</head>
<body>
<canvas id="view" aria-label="Luminal game view"></canvas>

<div id="attemptLabel" aria-hidden="true"></div>
<div id="signs" aria-hidden="true"></div>
<div id="sectionCard" aria-hidden="true"></div>
<div id="deathinfo" aria-live="polite"></div>

<div id="hud" hidden>
  <div id="prog" aria-hidden="true"><div id="progFill"></div><div id="cpMarks"></div><div id="progBest"></div><span id="progPct">0%</span></div>
  <button id="pauseBtn" class="hudbtn" aria-label="Pause">❚❚</button>
  <div id="practiceBar" hidden>
    <button id="cpAdd" class="hudbtn" aria-label="Place checkpoint (Z)"><span class="diamond"></span> Checkpoint <span class="count">Z</span></button>
    <button id="cpDel" class="hudbtn" aria-label="Remove last checkpoint (X)">Remove <span class="count">X</span></button>
    <span class="count"><span id="cpCount">0</span> saved</span>
  </div>
</div>

<section id="title" class="screen" aria-label="Title">
  <div class="logo">
    <svg viewBox="0 0 120 104" aria-hidden="true">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#6ff6e6"/><stop offset="1" stop-color="#8d7bff"/></linearGradient></defs>
      <polygon points="60,4 116,100 4,100" fill="none" stroke="url(#lg)" stroke-width="4"/>
      <polygon points="60,40 84,82 36,82" fill="#ffffff" opacity="0.95"/>
      <line x1="0" y1="58" x2="46" y2="58" stroke="#fff" stroke-width="3"/>
      <line x1="74" y1="58" x2="120" y2="44" stroke="#6ff6e6" stroke-width="3"/>
      <line x1="74" y1="62" x2="120" y2="62" stroke="#b6a4ff" stroke-width="3"/>
      <line x1="74" y1="66" x2="120" y2="80" stroke="#ffb38a" stroke-width="3"/>
    </svg>
    <div class="wordmark">LUMINAL</div>
    <div class="subtitle">a rhythm run of light</div>
    <div class="level-name">Level · Heliotrope</div>
  </div>
  <div class="buttons">
    <button id="playBtn" class="btn primary">Play</button>
    <button id="practiceBtn" class="btn">Practice</button>
  </div>
  <div id="loadState" role="status">Synthesizing the soundtrack…</div>
  <div class="hint">
    <kbd>Space</kbd> <kbd>↑</kbd> click or tap to jump · hold to keep jumping<br>
    <kbd>Esc</kbd> pause · <kbd>R</kbd> restart · in practice <kbd>Z</kbd> checkpoint, <kbd>X</kbd> remove
  </div>
  <div id="rotateHint">Turn your phone sideways for the best view.</div>
  <div id="stats"></div>
  <details class="settings" id="settings">
    <summary>Settings</summary>
    <div class="settings-body">
      <label>Volume <input id="vol" type="range" min="0" max="100" value="80"></label>
      <label><input id="optFlash" type="checkbox" checked> Screen flashes</label>
      <label><input id="optShake" type="checkbox" checked> Screen shake</label>
      <label><input id="optAuto" type="checkbox" checked> Automatic practice checkpoints</label>
      <label title="If the music sounds late (Bluetooth headphones), move this right">Audio offset <input id="offset" type="range" min="-60" max="240" step="10" value="0"> <span id="offsetVal">0 ms</span></label>
      <button id="muteBtn" class="linkish" aria-pressed="false">Sound on</button>
      <button id="resetBtn" class="linkish">Erase progress</button>
    </div>
  </details>
</section>

<section id="pause" class="screen dim" aria-label="Paused" hidden>
  <h2>PAUSED</h2>
  <div id="pauseInfo"></div>
  <div class="buttons">
    <button id="resumeBtn" class="btn primary">Resume</button>
    <button id="restartBtn" class="btn">Restart</button>
    <button id="practiceToggle" class="btn">Practice mode</button>
    <button id="quitBtn" class="btn">Title</button>
  </div>
</section>

<section id="complete" class="screen dim" aria-label="Level complete" hidden>
  <h2>COMPLETE</h2>
  <div id="completeStats"></div>
  <div class="buttons">
    <button id="againBtn" class="btn primary">Play again</button>
    <button id="titleBtn" class="btn">Title</button>
  </div>
</section>

<div id="fatal" hidden></div>

<script src="src/core.js"></script>
<script src="src/builder.js"></script>
<script src="src/physics.js"></script>
<script src="src/song.js"></script>
<script src="src/level.js"></script>
<script src="src/route.js"></script>
<script src="src/render.js"></script>
<script src="src/world.js"></script>
<script src="src/scene.js"></script>
<script src="src/audio.js"></script>
<script src="src/game.js"></script>
<script>LUMINAL.startGame();</script>
</body>
</html>
