[[assets]]
file = "A_World_in_a_Drop_EDIT.blend"
description = "Native Blender scene-strip timeline with packed fonts, sound and ocean reflection"
[[assets]]
file = "original_score.wav"
description = "Original synthesized 62-second stereo 48 kHz, 32-bit PCM score"
[[assets]]
file = "A_World_in_a_Drop_Complete.zip"
