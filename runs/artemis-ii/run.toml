# Run manifest — see RUNS.md at the repository root for the field reference.
schema = 1
slug = "artemis-ii"
title = "ARTEMIS II — Built for the Journey"
summary = "An 89-second Blender film: the Artemis II SLS Block 1 and Orion resolve from their components into the full stack, then launch from Pad 39B."
date = 2026-09-26
kind = "long-horizon"
medium = ["film", "blender", "python", "procedural", "video", "sound"]
hero = "preview/hero.webp"
entry = "src/build_all.py"
curator_note = ""

[agent]
model = "unrecorded"
model_id = "unrecorded"
harness = "Claude Code (cloud session)"

[run]
brief = "brief.md"
human_turns = 3
wall_clock_minutes = 992
log = "process/PROGRESS.md"
snapshots = "process/snapshots"

[build]
requirements = "requirements.txt"
command = "python3 src/build_all.py"
verify = "python3 src/verify.py"
timeout_minutes = 1200

[[assets]]
file = "artemis_ii_built_for_the_journey_1080p.mp4"
description = "The film: 89.0 s, 1920 x 1080, 24 fps, H.264 CRF 18 + AAC stereo (64 MB)"

[[assets]]
file = "artemis_ii_built_for_the_journey_web.mp4"
description = "Lighter copy of the film, H.264 two-pass 2.35 Mb/s (28 MB)"

