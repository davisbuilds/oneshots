description = "I · Matter — copper sculpture still, Blender Cycles 128 spp, 2400 x 3000 PNG"

[[assets]]
file = "trace_ink.png"
description = "II · Trace — ink painting still, 2400 x 3000 PNG"

[[assets]]
file = "energy_light.png"
