<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Bit by Bit</title>
<meta name="description" content="Bit by Bit: a puzzle game that teaches data structures and algorithms by making you the algorithm.">
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="bit" viewBox="0 0 64 64">
    <path d="M32 13V6" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="32" cy="5.5" r="3.5" fill="var(--mustard)" stroke="var(--ink)" stroke-width="2.5"/>
    <rect x="12" y="17" width="44" height="42" rx="12" fill="var(--shade)"/>
    <rect x="9" y="13" width="44" height="42" rx="12" fill="var(--teal)" stroke="var(--ink)" stroke-width="3"/>
    <ellipse cx="23" cy="31" rx="6.5" ry="7.5" fill="#fff" stroke="var(--ink)" stroke-width="2.5"/>
    <ellipse cx="39" cy="31" rx="6.5" ry="7.5" fill="#fff" stroke="var(--ink)" stroke-width="2.5"/>
    <circle cx="24.5" cy="32.5" r="3" fill="var(--pupil)"/><circle cx="40.5" cy="32.5" r="3" fill="var(--pupil)"/>
    <path d="M25 44q6 5 12 0" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>
  </symbol>
  <symbol id="murphy" viewBox="0 0 64 64">
    <path d="M13 54Q7 26 22 20L16 6l13 9q6-1 12 0L54 6l-6 14q15 6 9 34Q35 64 13 54z" fill="var(--shade)" transform="translate(3 3)"/>
    <path d="M13 54Q7 26 22 20L16 6l13 9q6-1 12 0L54 6l-6 14q15 6 9 34Q35 64 13 54z" fill="var(--violet)" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/>
    <path d="M17 27l12 5M53 27l-12 5" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="25" cy="35" rx="5" ry="4.5" fill="var(--mustard)" stroke="var(--ink)" stroke-width="2.5"/>
    <ellipse cx="45" cy="35" rx="5" ry="4.5" fill="var(--mustard)" stroke="var(--ink)" stroke-width="2.5"/>
    <path d="M25 32.500v5M45 32.500v5" stroke="var(--pupil)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M22 45q13 2 26 0q-2 9-13 9t-13-9z" fill="#fff" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M28.5 46v7M35 46.500v8M41.5 46v7" stroke="var(--ink)" stroke-width="2"/>
  </symbol>
</svg>
<div id="app">
  <main id="map" class="screen"></main>
  <main id="book" class="screen" hidden></main>
  <main id="play" class="screen" hidden>
    <header class="bar">
      <button class="btn icon" data-home aria-label="Back to the map"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 5l-7 7 7 7"/></svg></button>
      <button class="title" id="info" aria-label="Show the lesson again"><span id="lvname"></span></button>
      <div class="meter" id="meter" aria-live="polite"></div>
      <div class="tools">
        <button class="btn icon" id="undo" aria-label="Undo (Z)"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5L4 9l4 4"/><path d="M4 9h9a6 6 0 010 12H9"/></svg></button>
        <button class="btn icon" id="again" data-again aria-label="Restart (R)"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 108-8H7"/><path d="M10 1L7 4l3 3"/></svg></button>
        <button class="btn icon" id="hint" aria-label="Hint (H)"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 00-4 10.500c.8.8 1 1.5 1 2.500h6c0-1 .2-1.7 1-2.500A6 6 0 0012 3z"/></svg></button>
        <button class="btn icon" id="sound" aria-label="Sound on or off"></button>
      </div>
    </header>
    <p class="task" id="task" aria-live="polite"></p>
    <div class="middle">
      <div id="stagewrap"><svg id="stage" role="group" aria-label="Puzzle" preserveAspectRatio="xMidYMid meet"></svg></div>
      <aside id="codepane" hidden></aside>
    </div>
    <div id="demobar" hidden></div>
    <footer class="talk" id="talk"><span id="talkface"></span><p id="say" aria-live="polite"></p></footer>
  </main>
  <div id="modal" hidden></div>
</div>
<script src="src/core.js"></script>
<script src="src/logic/search.js"></script>
<script src="src/logic/sort.js"></script>
<script src="src/logic/linear.js"></script>
<script src="src/logic/hash.js"></script>
<script src="src/logic/tree.js"></script>
<script src="src/logic/graph.js"></script>
<script src="src/logic/recur.js"></script>
<script src="src/levels.js"></script>
<script src="src/dom.js"></script>
<script src="src/draw.js"></script>
<script src="src/audio.js"></script>
<script src="src/views/search.js"></script>
<script src="src/views/sort.js"></script>
<script src="src/views/linear.js"></script>
<script src="src/views/tree.js"></script>
<script src="src/views/graph.js"></script>
<script src="src/views/recur.js"></script>
<script src="src/app.js"></script>
</body>
</html>
