name: Validate Runs

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-runs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate manifests, size caps and index
        run: python3 scripts/validate_runs.py

      - name: Check resumable build recovery
        run: |
          python3 runs/three-worlds-chatgpt/src/test_build.py
          python3 runs/three-worlds/src/test_build.py
          python3 runs/artemis-ii/src/test_build_all.py
