name: Workflow Security Audit

on:
  pull_request:
    paths: [".github/workflows/**", ".github/dependabot.yml"]
  push:
    branches: [main]
    paths: [".github/workflows/**", ".github/dependabot.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.19"
          enable-cache: false

      - name: Audit workflow security
        run: uvx zizmor==1.30.0 --offline --strict-collection .github/workflows/
